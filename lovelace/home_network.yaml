views:
  - title: 网关
    path: overview
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 网络拓扑
            icon: mdi:lan-connect
          - type: custom:button-card
            entity: sensor.home_network_ping
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            grid_options:
              columns: full
              rows: auto
            styles:
              card:
                - border-radius: 0
                - box-shadow: none
                - padding: clamp(12px, 3vw, 28px)
                - text-align: start
              grid:
                - grid-template-areas: '"map"'
                - grid-template-columns: minmax(0, 1fr)
            custom_fields:
              map: |
                [[[
                  const samples = entity && !['unknown', 'unavailable'].includes(entity.state)
                    ? entity.attributes.result || [] : [];
                  const metric = (ip, name) => {
                    const sample = samples.find(s => s.metric.url === ip && s.metric.__name__ === name);
                    const n = Number(sample?.value?.[1]);
                    return Number.isFinite(n) ? n : null;
                  };
                  const phx10 = {name: 'phx10', ip: '10.0.10.10', probe: '10.0.10.10'};
                  const phx01 = {name: 'phx01', ip: '100.64.1.2', probe: '10.0.10.2', children: [phx10]};
                  const tunnel = {name: 'Tailscale', ip: '100.64.0.10', children: [phx01]};
                  const router = {name: '水星路由', ip: '192.168.0.1', probe: '192.168.0.1', children: [
                    {name: 'AP', ip: '192.168.0.2'},
                    {name: 'M4 mini', ip: '192.168.0.9', probe: '192.168.0.9'},
                    {name: 'N1 旁路由', ip: '192.168.0.10', children: [tunnel]}
                  ]};
                  function station(node) {
                    const code = metric(node.probe, 'ping_result_code');
                    const ms = metric(node.probe, 'ping_average_response_ms');
                    const tone = code === null ? 'idle' : code === 0 ? 'up' : 'down';
                    const status = code === null ? (node.probe ? '暂无数据' : '未探测')
                      : code !== 0 ? '不可达' : ms === null ? '在线' : ms.toFixed(1) + ' ms';
                    const probe = node.probe && node.probe !== node.ip ? ' · 探测 ' + node.probe : '';
                    return '<li><div class="station ' + tone + '"><div><strong>' + node.name +
                      '</strong><small>' + (node.ip || '') + probe + '</small></div><em>' + status +
                      '</em></div>' + (node.children ? '<ul>' + node.children.map(station).join('') +
                      '</ul>' : '') + '</li>';
                  }
                  return '<ul class="rail">' + station({name: '光猫', children: [router]}) + '</ul>';
                ]]]
            extra_styles: |
              .rail, .rail ul { list-style: none; margin: 0; padding: 0; }
              .rail { --track: var(--divider-color); text-align: start; white-space: normal; }
              .rail ul { margin-inline-start: clamp(7px, 1.4vw, 18px); }
              .rail li { position: relative; padding-inline-start: 12px; }
              .rail li::before, .rail li::after { content: ""; position: absolute; left: 0; }
              .rail li::before { top: 0; bottom: 0; border-left: 2px solid var(--track); }
              .rail li:last-child::before { height: 22px; }
              .rail li::after { top: 21px; width: 12px; border-top: 2px solid var(--track); }
              .rail > li { padding: 0; }
              .rail > li::before, .rail > li::after { display: none; }
              .station { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                padding: 6px 10px; min-height: 32px; border-bottom: 1px solid var(--track); }
              .station strong, .station small { display: block; }
              .station strong { font-size: 15px; }
              .station small, .station em { color: var(--secondary-text-color); font-size: 12px;
                font-style: normal; font-variant-numeric: tabular-nums; }
              .station em { white-space: nowrap; }
              .station.up em { color: var(--success-color); }
              .station.down { border-inline-end: 4px solid var(--error-color); }
              .station.down em { color: var(--error-color); }
      - type: grid
        cards:
          - type: heading
            heading: MR108GP-AC
            icon: mdi:router-network
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: true
            card:
              type: entities
              title: 网关遥测
              show_header_toggle: false
            filter:
              include:
                - entity_id: sensor.mercury_smb*
            sort:
              method: name
            else:
              type: markdown
              content: 当前没有匹配的 Mercury SMB 传感器。
          - type: markdown
            title: 节点 Ping
            grid_options:
              columns: full
              rows: auto
            content: |
              {% set rows = state_attr('sensor.home_network_ping', 'result') or [] %}
              {% if not has_value('sensor.home_network_ping') or not rows %}
              暂无探测数据
              {% else %}
              {% set names = {'192.168.0.1':'水星路由','192.168.0.9':'M4 mini','10.0.10.2':'phx01','10.0.10.10':'phx10','1.0.0.1':'Cloudflare DNS'} %}
              | 探测目标 | 状态 | 延迟 | 丢包 |
              | :--- | :--- | ---: | ---: |
              {% for ip, samples in rows | groupby('metric.url') -%}
              {% set ns = namespace(code=none, ms=none, loss=none) -%}
              {% for sample in samples -%}
              {% set val = sample.value[1] | float(none) -%}
              {% if is_number(val) -%}
              {% if sample.metric['__name__'] == 'ping_result_code' %}{% set ns.code = val %}{% endif -%}
              {% if sample.metric['__name__'] == 'ping_average_response_ms' %}{% set ns.ms = val %}{% endif -%}
              {% if sample.metric['__name__'] == 'ping_percent_packet_loss' %}{% set ns.loss = val %}{% endif -%}
              {% endif -%}
              {% endfor -%}
              | {{ names.get(ip, ip) }} | {{ '—' if ns.code is none else '在线' if ns.code == 0 else '不可达' }} | {{ (ns.ms | round(2) ~ ' ms') if ns.ms is not none else '—' }} | {{ (ns.loss | round(1) ~ '%') if ns.loss is not none else '—' }} |
              {% endfor %}
              {% endif %}
          - type: heading
            heading: Grafana 监控
            icon: mdi:chart-line
          - type: button
            name: Ping · 最近 6 小时
            icon: mdi:pulse
            icon_height: 28px
            tap_action:
              action: url
              url_path: 'https://console.appsvc.net/grafana/d/tin79zv/-ping?from=now-6h&to=now&timezone=browser'
          - type: button
            name: N1 旁路由 · 主机指标
            icon: mdi:server
            icon_height: 28px
            tap_action:
              action: url
              url_path: 'https://console.appsvc.net/grafana/d/node-exporter/node-exporter-full?from=now-5m&to=now&timezone=browser&var-datasource=default&var-job=node_exporter&var-node=192.168.0.10:9100&var-diskdevices=%5Ba-z%5D%2B%7Cnvme%5B0-9%5D%2Bn%5B0-9%5D%2B%7Cmmcblk%5B0-9%5D%2B&refresh=30s'
          - type: button
            name: Mihomo · 代理流量
            icon: mdi:swap-vertical
            icon_height: 28px
            tap_action:
              action: url
              url_path: 'https://console.appsvc.net/grafana/d/adsxzpf/mihomo-exporter-e79b91-e68ea7-v2?from=now-15m&to=now&timezone=browser&var-datasource=PA396B7035A9690C9&var-node=$__all&refresh=30s'
  - title: 地址簿
    path: addresses
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 静态地址分配
            icon: mdi:lan
