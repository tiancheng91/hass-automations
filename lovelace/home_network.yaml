            title: 网络设备
            grid_options:
              columns: 12
              rows: auto
            content: |
              {% set nodes = [('AP', '192.168.0.2'), ('AP-IoT', '192.168.0.3')] %}
              {% set trackers = states.device_tracker | selectattr('attributes.source_type', 'defined')
                 | selectattr('attributes.source_type', 'eq', 'router')
                 | selectattr('attributes.ip', 'defined') | list %}
              | 设备 | 保留地址 | 路由跟踪 |
              | :--- | :--- | :--- |
              {% for label, ip in nodes -%}
              {% set states_at_ip = trackers | selectattr('attributes.ip', 'eq', ip) | map(attribute='state') | list -%}
              | {{ label }} | `{{ ip }}` | {{ '在线' if 'home' in states_at_ip else '离线' if states_at_ip and states_at_ip | reject('eq', 'not_home') | list | length == 0 else '未确认' }} |
