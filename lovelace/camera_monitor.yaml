views:
  - title: 客厅
    path: live
    type: panel
    cards:
      - type: custom:webrtc-camera
        url: micam00
        ui: true
        muted: true
        style: &player_style |
          ha-card {
            display: block;
            width: min(100%, 1440px);
            height: auto;
            margin: 0 auto;
          }
          video {
            display: block;
            width: 100%;
            height: auto;
            max-height: calc(100dvh - 72px);
            object-fit: contain;
          }
