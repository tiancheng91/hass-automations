views:
  - title: 客厅
    path: live
    type: sidebar
    cards:
      - type: custom:webrtc-camera
        url: micam00
        ui: true
        muted: true
        style: &player_style |
          ha-card {
            display: block;
            width: min(calc(100% - 48px), 1120px);
            height: auto;
            margin: 24px auto;
          }
          @media (max-width: 600px) {
            ha-card {
              width: calc(100% - 24px);
              margin: 12px auto;
            }
          }
          video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 75dvh;
            object-fit: contain;
          }
          :fullscreen video, video:fullscreen {
            max-height: 100dvh;
          }
      - type: custom:auto-entities
        view_layout:
          position: sidebar
        show_empty: false
        card:
          type: entities
          title: 设备状态
          show_header_toggle: false
        filter:
          template: >-
            {{ expand(device_entities('0d15113cc42d14c1ff5b353124a64aa6'))
               | selectattr('domain', 'in', ['sensor', 'binary_sensor', 'event'])
               | map(attribute='entity_id') | list }}
      - type: custom:auto-entities
        view_layout:
          position: sidebar
        show_empty: false
        card:
          type: entities
          title: 摄像头控制
          show_header_toggle: false
        filter:
          template: >-
            {{ expand(device_entities('0d15113cc42d14c1ff5b353124a64aa6'))
               | selectattr('domain', 'in', ['switch', 'select', 'light'])
               | map(attribute='entity_id') | list }}
      - type: logbook
        view_layout:
          position: sidebar
        title: 最近 24 小时活动
        hours_to_show: 24
        target:
          device_id: 0d15113cc42d14c1ff5b353124a64aa6
