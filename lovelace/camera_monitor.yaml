views:
  - title: 监控
    path: live
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:webrtc-camera
            ui: true
            muted: true
            # 首次加载播放第一路，点击画面上的名称可切换摄像头。
            streams:
              - name: 客厅
                url: micam00
              - name: 书房小方
                url: micam01
              - name: 次卧
                url: micam02
              - name: 阳台小方
                url: micam03
            grid_options:
              columns: full
              rows: auto
