button_card_templates:
  camera_status:
    show_state: true
    show_icon: false
    tap_action:
      action: more-info
    styles:
      card:
        - border-radius: 0
        - box-shadow: none
        - min-height: 84px
        - padding: 12px clamp(10px, 1vw, 16px)
        - text-align: left
        - background: var(--ha-card-background, var(--card-background-color))
      grid:
        - grid-template-areas: '"s" "n"'
        - grid-template-columns: minmax(0, 1fr)
        - gap: 6px
      state:
        - justify-self: start
        - max-width: 100%
        - font-size: clamp(20px, 2vw, 30px)
        - line-height: 1.2
        - font-weight: 500
        - font-variant-numeric: tabular-nums
      name:
        - justify-self: start
        - max-width: 100%
        - white-space: normal
        - overflow-wrap: anywhere
        - line-height: 1.25
        - font-size: 13px
        - color: var(--secondary-text-color)
    state:
      - operator: template
        value: >
          [[[ return ['unknown', 'unavailable', 'offline', 'error', 'fault',
                      '离线', '异常', '故障', '不可用'].includes(entity.state.toLowerCase()); ]]]
        styles:
          card:
            - border-inline-start: 4px solid var(--primary-color)
            - background: color-mix(in srgb, var(--primary-color) 12%, var(--card-background-color))
          state:
            - color: var(--primary-color)

views:
  - title: 客厅
    path: live
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 客厅 · 实时画面
            icon: mdi:cctv
          - type: custom:webrtc-camera
            url: micam00
            muted: true
            ui: true
            grid_options: &video_grid
              columns: full
              rows: auto
            style: &player_style |
              ha-card {
                display: block;
                width: min(100%, 1120px);
                margin-inline: auto;
                overflow: hidden;
                background: #101820;
                border-radius: 0;
                border-block-end: 3px solid var(--primary-color);
                box-sizing: border-box;
              }
              .mode {
                background: rgba(12, 17, 24, .82);
                color: white;
                padding: 3px 8px;
                font: 600 12px/1.4 monospace;
                letter-spacing: .06em;
                opacity: 1;
              }
              video {
                display: block;
                width: 100%;
                height: auto;
                max-height: 75dvh;
                object-fit: contain;
              }
              :fullscreen video, video:fullscreen { max-height: 100dvh; }
      - type: grid
        cards:
          - type: custom:auto-entities
            grid_options: *video_grid
            show_empty: false
            card:
              type: grid
              title: 设备状态
              columns: 2
              square: false
              card_mod: &status_spacing
                style: |
                  :host { --grid-card-gap: 8px; }
            card_param: cards
            filter:
              template: >-
                {% set device = '0d15113cc42d14c1ff5b353124a64aa6' %}
                {% set prefix = (device_attr(device, 'name_by_user') or device_attr(device, 'name') or '') ~ ' ' %}
                {% set ns = namespace(stream=[], storage=[], alerts=[], capacity=[], other=[]) %}
                {% for item in expand(device_entities(device))
                   | selectattr('domain', 'in', ['sensor', 'binary_sensor', 'event'])
                   | rejectattr('name', 'search', '巡航')
                   | rejectattr('entity_id', 'search', 'cruise')
                   | sort(attribute='entity_id') %}
                  {% set label = item.name.removeprefix(prefix)
                     | regex_replace('^(视频流管理|存储卡管理|摄像机控制) +', '') %}
                  {% set stream = '流状态' in label %}
                  {% set storage = '存储卡' in item.name and '工作状态' in label %}
                  {% set title = ('视频流' if not ns.stream else '视频流 ' ~ (ns.stream | length + 1))
                     if stream else '存储卡' if storage else label %}
                  {% set tile = dict(type='custom:button-card', template='camera_status',
                                     entity=item.entity_id, name=title) %}
                  {% if stream %}{% set ns.stream = ns.stream + [tile] %}
                  {% elif storage %}{% set ns.storage = ns.storage + [tile] %}
                  {% elif item.state | lower in ['offline', 'unavailable', 'error', 'fault', '离线', '异常', '故障', '不可用'] %}
                    {% set ns.alerts = ns.alerts + [tile] %}
                  {% elif '空间' in label or '容量' in label %}{% set ns.capacity = ns.capacity + [tile] %}
                  {% else %}{% set ns.other = ns.other + [tile] %}
                  {% endif %}
                {% endfor %}
                {{ (ns.stream[:1] + ns.storage[:1] + ns.alerts + ns.capacity + ns.other + ns.stream[1:] + ns.storage[1:])[:6] | to_json }}
          - type: heading
            heading: 最近 24 小时活动
            icon: mdi:timeline-clock-outline
          - type: logbook
            grid_options: *video_grid
            card_mod: &activity_style
              style: |
                ha-card {
                  border-radius: 0;
                  box-shadow: none;
                  border-block-start: 2px solid var(--primary-color);
                }
            hours_to_show: 24
            target:
              device_id: 0d15113cc42d14c1ff5b353124a64aa6
          - type: heading
            heading: 查看设备详情
            heading_style: subtitle
            icon: mdi:arrow-top-right
            tap_action:
              action: navigate
              navigation_path: /config/devices/device/0d15113cc42d14c1ff5b353124a64aa6
