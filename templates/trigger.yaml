
# 客厅人在：摄像头 AI 检测 + 5 分钟无新事件自动关闭
# 监听 camera.person，camera_id=xiaomi1 且 payload.event_type=person 时视为有人
- triggers:
    - trigger: event
      event_type: camera.person
  binary_sensor:
    - default_entity_id: binary_sensor.living_room_presence
      name: "客厅人在"
      device_class: occupancy
      state: >
        {% if trigger.platform == 'event' %}
          {% set data = trigger.event.data %}
          {% if data.get('camera_id') == 'xiaomi1' and data.get('event_type') == 'person' %}
            true
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}
        {% else %}
          {{ this.state == 'on' }}
        {% endif %}
      auto_off:
        minutes: 5
