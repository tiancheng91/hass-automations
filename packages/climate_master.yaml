# 主卧空调自动化控制（风扇由 automations/device_fan.yaml 独立控制）
# 维持逻辑对齐客厅：白天目标28、夜间29（室温<26强制29），偏低每次+1；风量白天自动/夜间低风/室温>=29高风
# 另保留：夜间22:00-06:00过热开空调、离家关空调
# 无独立自动化开关，始终生效

automation:
  - alias: 主卧 - 维持目标温度与风量
    id: bedroom_climate_maintain
    mode: single
    initial_state: true
    trace:
      stored_traces: 48
    description: >-
      每30分钟检查一次，仅在空调开启时执行。
      温度目标：白天28°C、夜间29°C（室温<26°C 时强制29°C）；若当前设定低于目标，每次只上调1°C，达到后不再改；高于目标不改。
      风量：白天自动、夜间低风；室温>=29°C 时临时高风。
    trigger:
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.090615_cn_proxy_681594875_00003_ktf
            state: 'off'
    action:
      - variables:
          is_daytime: "{{ 10 <= now().hour < 23 }}"
          current_temp: "{{ state_attr('climate.090615_cn_proxy_681594875_00003_ktf', 'current_temperature') | float(0) }}"
          setpoint: "{{ state_attr('climate.090615_cn_proxy_681594875_00003_ktf', 'temperature') | float(99) }}"
          is_hot: "{{ current_temp >= 29 }}"
          target_temp: "{{ 29 if current_temp < 26 else (28 if is_daytime else 29) }}"
          next_temp: "{{ [setpoint + 1, target_temp] | min }}"
          target_fan: "{{ '高风' if is_hot else ('自动' if is_daytime else '低风') }}"
      - if:
          - condition: template
            value_template: "{{ setpoint < target_temp }}"
        then:
          - service: climate.set_temperature
            entity_id: climate.090615_cn_proxy_681594875_00003_ktf
            data:
              temperature: "{{ next_temp }}"
      - service: climate.set_fan_mode
        entity_id: climate.090615_cn_proxy_681594875_00003_ktf
        data:
          fan_mode: "{{ target_fan }}"

  - alias: 主卧 - 温度高_开空调
    id: bedroom_climate_on
    mode: single
    initial_state: false
    trace:
      stored_traces: 48
    description: >-
      仅夜间22:00至次日06:00且有人在家时，室温持续高于29°C达5分钟且空调关闭时自动开空调；
      其它时间由人工开启。
    trigger:
      - platform: numeric_state
        entity_id: climate.090615_cn_proxy_681594875_00003_ktf
        attribute: current_temperature
        above: 29
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: binary_sensor.home_state
        state: "on"
      - condition: time
        after: '22:00'
        before: '06:00'
      - condition: state
        entity_id: climate.090615_cn_proxy_681594875_00003_ktf
        state: 'off'
    action:
      - service: climate.turn_on
        entity_id: climate.090615_cn_proxy_681594875_00003_ktf

  - alias: 主卧 - 关闭空调
    id: bedroom_turn_off_all
    mode: single
    initial_state: true
    trace:
      stored_traces: 48
    description: 离家状态持续10分钟后，关闭主卧空调。风扇由 device_fan 自动化独立处理。
    trigger:
      - platform: state
        entity_id: binary_sensor.home_state
        from: "on"
        to: "off"
        for:
          minutes: 10
    action:
      - service: climate.turn_off
        entity_id: climate.090615_cn_proxy_681594875_00003_ktf
