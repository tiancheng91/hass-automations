# 客厅空调自动化控制
# 每30分钟检查一次，空调开启时强制目标温度与风量
# 白天(10:00-21:00)目标温度28°C、风量自动；夜间目标温度29°C、风量低风
# 无独立自动化开关，始终生效

automation:
  - alias: 客厅 - 维持目标温度与风量
    id: living_room_climate_maintain
    mode: single
    initial_state: true
    description: >-
      每30分钟检查一次，仅在空调开启时执行：
      白天(10:00-21:00)目标温度28°C、风量自动；
      夜间目标温度29°C、风量低风。
    trigger:
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.090615_cn_proxy_681594875_00004_ktf
            state: 'off'
    action:
      - variables:
          is_daytime: "{{ 10 <= now().hour < 21 }}"
          target_temp: "{{ 28 if is_daytime else 29 }}"
          target_fan: "{{ '自动' if is_daytime else '低风' }}"
      - service: climate.set_temperature
        entity_id: climate.090615_cn_proxy_681594875_00004_ktf
        data:
          temperature: "{{ target_temp }}"
      - service: climate.set_fan_mode
        entity_id: climate.090615_cn_proxy_681594875_00004_ktf
        data:
          fan_mode: "{{ target_fan }}"
