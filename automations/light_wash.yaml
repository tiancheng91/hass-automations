# 卫生间灯光自动化配置
# 领普人体传感器2 - 移动检测自动控制灯光
# 吸顶筒灯：偏暖色温 + 较低亮度，避免婴儿洗脸洗屁屁时直视刺眼
# ========== 检测到移动 - 调高亮度 ==========
- alias: 卫生间 - 检测到移动调高亮度
  id: light_wash_motion_detected
  mode: single
  description: 检测到移动时，根据时间段以暖色温渐进调高亮度（婴儿护理友好）
  trigger:
    - platform: state
      entity_id: event.linp_cn_blt_3_1glkll4soco00_hs1bb1_motion_detected_e_2_1008
      not_from:
        - "unavailable"
        - "unknown"
      not_to:
        - "unavailable"
        - "unknown"
  condition:
    # 只在有人在家时触发（使用优化后的home_state传感器）
    - condition: state
      entity_id: binary_sensor.home_state
      state: "on"
  action:
    - variables:
        # 获取当前时间（小时）
        current_hour: "{{ now().hour }}"
        # 根据时间段计算最高亮度百分比（筒灯直射，整体偏低）
        max_brightness_pct: >
          {% if current_hour >= 0 and current_hour < 8 %}
            {# 凌晨00-08点，最高亮度15% #}
            15
          {% elif current_hour >= 8 and current_hour < 18 %}
            {# 白天08-17点，最高亮度20% #}
            20
          {% else %}
            {# 晚间18-24点，最高亮度18% #}
            18
          {% endif %}
        # 偏暖色温，夜间更暖以减少刺眼感
        color_temp_kelvin: >
          {% if current_hour >= 8 and current_hour < 18 %}
            3000
          {% else %}
            2700
          {% endif %}

    # 优化条件：如果当前亮度与目标 max_brightness_pct 相同，则跳过亮度调整
    - condition: template
      value_template: >
        {% set light = states.light.mijia_cn_group_1755950629190250500_group3_s_2_light %}
        {% set current_brightness = (light.attributes.brightness or 0) | int * 100 // 255 %}
        {{ (current_brightness | int) != (max_brightness_pct | int) }}
    # 渐变开灯
    - service: light.turn_on
      target:
        entity_id: light.mijia_cn_group_1755950629190250500_group3_s_2_light
      data:
        brightness_pct: "{{ (max_brightness_pct | int) / 2 }}"
        color_temp_kelvin: "{{ color_temp_kelvin | int }}"
        transition: 1
    - delay:
        seconds: 1.2
    - service: light.turn_on
      target:
        entity_id: light.mijia_cn_group_1755950629190250500_group3_s_2_light
      data:
        brightness_pct: "{{ max_brightness_pct }}"
        color_temp_kelvin: "{{ color_temp_kelvin | int }}"
        transition: 2

# ========== 无移动300秒 - 调低到8% ==========
- alias: 卫生间 - 无移动300秒调低亮度
  id: light_wash_no_motion_300s
  mode: single
  description: 无移动300秒后，以暖色温调低灯光亮度到8%（渐进调整）
  trigger:
    - platform: state
      entity_id: sensor.linp_cn_blt_3_1glkll4soco00_hs1bb1_no_motion_duration_p_2_1024
      to: "300"
  condition:
    # 只在有人在家时触发（使用优化后的home_state传感器）
    - condition: state
      entity_id: binary_sensor.home_state
      state: "on"
    # 确保灯光当前是开启状态
    - condition: state
      entity_id: light.mijia_cn_group_1755950629190250500_group3_s_2_light
      state: 'on'
  action:
    - service: light.turn_on
      target:
        entity_id: light.mijia_cn_group_1755950629190250500_group3_s_2_light
      data:
        brightness_pct: 8
        color_temp_kelvin: 2700
        transition: 3

# ========== 无移动600秒 - 关闭或降低亮度 ==========
- alias: 卫生间 - 无移动600秒关闭或降低亮度
  id: light_wash_no_motion_600s
  mode: single
  description: 无移动600秒后，白天08-17点关闭灯光，其它时间以暖色温降低到5%亮度（渐进调整）
  trigger:
    - platform: state
      entity_id: sensor.linp_cn_blt_3_1glkll4soco00_hs1bb1_no_motion_duration_p_2_1024
      to: "600"
  condition:
    # 只在有人在家时触发（使用优化后的home_state传感器）
    - condition: state
      entity_id: binary_sensor.home_state
      state: "on"
    # 确保灯光当前是开启状态
    - condition: state
      entity_id: light.mijia_cn_group_1755950629190250500_group3_s_2_light
      state: 'on'
  action:
    - variables:
        # 获取当前时间（小时）
        current_hour: "{{ now().hour }}"
        # 判断是否为白天08-17点
        is_daytime: "{{ current_hour >= 8 and current_hour < 17 }}"
    - choose:
        # 白天08-17点：关闭灯光
        - conditions:
            - condition: template
              value_template: "{{ is_daytime }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.mijia_cn_group_1755950629190250500_group3_s_2_light
              data:
                transition: 3
        # 其它时间：降低到5%亮度
        - conditions:
            - condition: template
              value_template: "{{ not is_daytime }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.mijia_cn_group_1755950629190250500_group3_s_2_light
              data:
                brightness_pct: 5
                color_temp_kelvin: 2700
                transition: 3
