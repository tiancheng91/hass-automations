- alias: 助手 - 天气提醒（雨雪）
  id: alert_weather_rainy_snowy_reminder
  description: 每天早上8点检查天气，如有雨或雪则推送提醒
  mode: single
  trigger:
    - platform: time
      at: "08:00:00"
  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: weather.home
          state: rainy
        - condition: state
          entity_id: weather.home
          state: snowy
  action:
    - service: script.serverchan_push
      data:
        title: >
          {% set weather_state = states('weather.home') %}
          {% if weather_state == 'rainy' %}
            下雨提醒
          {% elif weather_state == 'snowy' %}
            下雪提醒
          {% else %}
            天气提醒
          {% endif %}
        content: >
          {% set weather_state = states('weather.home') %}
          {% set weather_condition = state_attr('weather.home', 'condition') | default('未知') %}
          {% set temperature = state_attr('weather.home', 'temperature') | default('未知') %}
          {% set humidity = state_attr('weather.home', 'humidity') | default('未知') %}
          {% set forecast = state_attr('weather.home', 'forecast') | default([]) %}
          
          📅 当日天气明细：
          • 天气状况：{{ weather_condition }}
          • 当前温度：{{ temperature }}°C
          • 湿度：{{ humidity }}%
          
          {% if forecast and forecast | length > 0 %}
          • 今日预报：{{ forecast[0].condition | default('未知') }}
          {% endif %}
          
          ⚠️ 注意事项：
          {% if weather_state == 'rainy' %}
          • 🌧️ 今日有雨，出门请带伞
          • 注意路面湿滑，小心驾驶
          • 建议穿着防雨衣物
          {% elif weather_state == 'snowy' %}
          • ❄️ 今日有雪，注意保暖
          • 路面可能结冰，出行注意安全
          • 建议穿着防滑鞋
          {% endif %}

- alias: 助手 - 耗电异常提醒
  id: alert_power_anomaly
  description: 全屋功耗持续超过2000W达2小时，且至少一台空调开启时，推送耗电异常提醒
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.pzem_004t_v3_power
      above: 2000
      for:
        hours: 2
  condition:
    - condition: or
      conditions:
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.090615_cn_proxy_681594875_00003_ktf
              state: 'off'
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.090615_cn_proxy_681594875_00002_ktf
              state: 'off'
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.090615_cn_proxy_681594875_00004_ktf
              state: 'off'
  action:
    - service: script.serverchan_push
      data:
        title: 耗电异常
        content: >
          {% set power = states('sensor.pzem_004t_v3_power') %}
          {% set ns = namespace(acs=[]) %}
          {% if states('climate.090615_cn_proxy_681594875_00003_ktf') != 'off' %}
            {% set ns.acs = ns.acs + ['主卧'] %}
          {% endif %}
          {% if states('climate.090615_cn_proxy_681594875_00002_ktf') != 'off' %}
            {% set ns.acs = ns.acs + ['次卧'] %}
          {% endif %}
          {% if states('climate.090615_cn_proxy_681594875_00004_ktf') != 'off' %}
            {% set ns.acs = ns.acs + ['客厅'] %}
          {% endif %}

          全屋功耗已持续超过 2000W 达 2 小时（当前 {{ power }} W）
          当前开启空调：{{ ns.acs | join('、') if ns.acs else '无' }}
