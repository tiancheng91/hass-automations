# 书房空气净化器自动化

- alias: 书房 - 空气净化器自动关闭
  id: study_air_purifier_auto_off
  mode: single
  description: 空气质量佳（空气优/空气良）持续超过30分钟时，自动关闭空气净化器
  trigger:
    # 空气质量状态变化时触发
    - platform: state
      entity_id: sensor.zhimi_cn_706039150_rma3_air_quality_p_3_8
      to:
        - "空气优"
        - "空气良"
        - "轻度污染"
    # 每小时定时触发，定期检查空气质量条件
    - platform: time_pattern
      minutes: 0
  condition:
    # 空气质量必须持续至少30分钟为良/优（使用 template sensor，支持在状态之间变动）
    - condition: state
      entity_id: binary_sensor.study_air_quality_good
      state: "on"
      for:
        minutes: 30
    # 确保净化器当前是开启状态
    - condition: state
      entity_id: switch.zhimi_cn_706039150_rma3_on_p_2_1
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.zhimi_cn_706039150_rma3_on_p_2_1

- alias: 书房 - 空气污染30分钟自动开启空气净化器
  id: study_air_pollution_auto_on
  initial_state: false
  mode: single
  description: 书房空气污染状态（轻度污染及以上）持续超过30分钟且净化器关闭时，自动开启净化器并提醒
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.zhimi_cn_706039150_rma3_air_quality_p_3_8') in ['轻度污染', '中度污染', '重度污染', '严重污染'] }}
      for: "00:30:00"
  condition:
    # 只在有人在家时触发
    - condition: state
      entity_id: binary_sensor.home_state
      state: "on"
    # 只在净化器关闭状态下执行
    - condition: state
      entity_id: switch.zhimi_cn_706039150_rma3_on_p_2_1
      state: "off"
  action:
    # 开启空气净化器（始终执行）
    - service: switch.turn_on
      target:
        entity_id: switch.zhimi_cn_706039150_rma3_on_p_2_1
    # 检查今天是否已经播报过，如果未播报则播报并更新日期
    - choose:
        # 如果今天还未播报，执行播报
        - conditions:
            - condition: template
              value_template: >
                {% set last_date = states('input_text.air_purifier_last_announce_date') | default('') %}
                {% set today = now().strftime('%Y-%m-%d') %}
                {{ last_date != today }}
          sequence:
            # 播放提醒消息
            - service: script.xiaoai_speak
              data:
                text: >
                  {% set air_quality = states('sensor.zhimi_cn_706039150_rma3_air_quality_p_3_8') %}
                  小爱提醒您，空气{{ air_quality }}，已自动开启空气净化器
            # 更新最后播报日期为今天
            - service: input_text.set_value
              target:
                entity_id: input_text.air_purifier_last_announce_date
              data:
                value: "{{ now().strftime('%Y-%m-%d') }}"
