# 主卧夜间温度与离家/回家设备控制
# 空调模式与目标温度由人工在设备端设置，自动化仅 turn_on/turn_off

- alias: 主卧 - 温度高_开空调
  id: bedroom_climate_on
  mode: single
  initial_state: true
  description: >-
    每晚22:00至次日07:30且有人在家时，室温持续高于29°C达5分钟且空调为关闭状态时自动开空调；
    不设置 hvac_mode/目标温度，沿用人工配置。
  trigger:
    - platform: numeric_state
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf
      attribute: current_temperature
      above: 29
      for:
        minutes: 5
  condition:
    - condition: state
      entity_id: binary_sensor.home_state
      state: "on"
    - condition: time
      after: '22:00'
      before: '07:30'
    - condition: state
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf
      state: 'off'
  action:
    - service: climate.turn_on
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf

- alias: 主卧 - 温度低_关空调
  id: bedroom_climate_off
  mode: single
  initial_state: true
  description: >-
    凌晨01:00-08:00内，室温低于28°C且空调非关闭时关空调；不检查是否在家。
    触发方式：(1) 温度持续低于28°C达10分钟；(2) 每天02:00检查，仅当当时温度仍低于28°C才关（非强制关机）。
  trace:
    stored_traces: 20
  trigger:
    - platform: numeric_state
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf
      attribute: current_temperature
      below: 28
      for:
        minutes: 10
    - platform: time
      at: "02:00:00"
  condition:
    - condition: time
      after: '01:00'
      before: '08:00'
    - condition: not
      conditions:
        - condition: state
          entity_id: climate.090615_cn_proxy_681594875_00003_ktf
          state: 'off'
    - condition: numeric_state
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf
      attribute: current_temperature
      below: 28
  action:
    - service: climate.turn_off
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf

- alias: 主卧 - 关闭设备
  id: bedroom_turn_off_all
  mode: single
  initial_state: true
  description: 离家状态（home_state 从 on 变为 off）持续10分钟后，关闭主卧空调与风扇。
  trigger:
    - platform: state
      entity_id: binary_sensor.home_state
      from: "on"
      to: "off"
      for:
        minutes: 10
  action:
    - service: climate.turn_off
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf
    - service: fan.turn_off
      entity_id: fan.dmaker_cn_659430584_p5c_s_2_fan

- alias: 主卧 - 开启设备
  id: bedroom_turn_on
  mode: single
  initial_state: true
  description: 回家状态（home_state 从 off 变为 on）持续5分钟且室温高于26°C时，开启主卧风扇（不自动开空调）。
  trigger:
    - platform: state
      entity_id: binary_sensor.home_state
      from: "off"
      to: "on"
      for:
        minutes: 5
  condition:
    - condition: numeric_state
      entity_id: climate.090615_cn_proxy_681594875_00003_ktf
      attribute: current_temperature
      above: 26
  action:
    - service: fan.turn_on
      entity_id: fan.dmaker_cn_659430584_p5c_s_2_fan
