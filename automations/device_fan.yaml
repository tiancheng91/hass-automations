# 主卧风扇 - 按在家状态与室温自动控制开关与转速
# 仅使用空调上报的当前室温，与空调开关/设定温度无关

- alias: 主卧 - 风扇自动控制
  id: bedroom_fan_level
  mode: single
  initial_state: true
  description: >-
    无人在家时关闭风扇；有人在家且室温≥26°C时开启并按室温调速；
    室温<26°C时关闭。不依赖空调开关与设定温度。
    执行前检查风扇开关与当前转速，已与目标一致则跳过，避免重复调用。
  trigger:
    - platform: state
      entity_id: binary_sensor.home_state
    - platform: state
      entity_id: climate.090615_cn_proxy_681594875_00002_ktf
      attribute: current_temperature
      for: "00:05:00"
  action:
    - variables:
        home: "{{ is_state('binary_sensor.home_state', 'on') }}"
        temp: "{{ state_attr('climate.090615_cn_proxy_681594875_00002_ktf', 'current_temperature') | float(0) }}"
        target_speed: >
          {% set levels = [
            {'min': 31, 'speed': 90},
            {'min': 30, 'speed': 65},
            {'min': 29, 'speed': 50},
            {'min': 28, 'speed': 30},
            {'min': 27, 'speed': 15},
            {'min': 26, 'speed': 10},
          ] %}
          {{ (levels | selectattr('min', 'le', temp | float(0)) | map(attribute='speed') | first) | default(0) | int }}
        current_speed: "{{ states('number.dmaker_cn_659430584_p5c_speed_level_p_8_1') | int(-1) }}"
        fan_is_off: "{{ is_state('fan.dmaker_cn_659430584_p5c_s_2_fan', 'off') }}"
        should_run: "{{ home and temp >= 26 }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not should_run and not fan_is_off }}"
          sequence:
            - service: fan.turn_off
              target:
                entity_id: fan.dmaker_cn_659430584_p5c_s_2_fan
        - conditions:
            - condition: template
              value_template: "{{ should_run and (fan_is_off or current_speed != target_speed) }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ fan_is_off }}"
              then:
                - service: fan.turn_on
                  target:
                    entity_id: fan.dmaker_cn_659430584_p5c_s_2_fan
            - if:
                - condition: template
                  value_template: "{{ current_speed != target_speed }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.dmaker_cn_659430584_p5c_speed_level_p_8_1
                  data:
                    value: "{{ target_speed }}"
