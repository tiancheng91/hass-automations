# 猫砂盆自动化配置
# 小佩智能全自动猫厕所 MAX2 - 垃圾箱状态监控
# ========== 垃圾箱满了延迟提醒 ==========
- alias: 阳台 - 猫砂盆垃圾箱满了4小时提醒
  id: cat_litter_wastebin_full_reminder
  mode: single
  description: 当猫砂盆垃圾箱状态持续为on超过4小时（表示垃圾箱已满且未清理），通过微信发送提醒
  trigger:
    - platform: state
      entity_id: binary_sensor.xiao_pei_zhi_neng_quan_zi_dong_mao_ce_suo_max2_wastebin
      from: "off"
      to: "on"
      for:
        hours: 4
  action:
    - service: script.claw_execute
      data:
        message: "给微信群聊 高效信息传递群 发送 猫砂盆集便仓已满(4h)，请及时清理"
