- alias: HASS - 初始化
  id: hass_init
  description: ""
  mode: single
  triggers:
    - event: start
      trigger: homeassistant
  conditions: []
  actions:
    - metadata: {}
      data:
        mode: light
        name: Metro Red
      action: frontend.set_theme

- alias: HASS - 清理日志
  id: hass_purge_log
  triggers:
    - trigger: time
      at: "04:00:00"
  conditions: []
  actions:
    - action: recorder.purge_entities
      data:
        keep_days: 3
        entity_globs: sensor.mercury_smb* sensor.linp_cn_*_body_distance_*
  mode: single

- alias: HASS - 清理数据库
  id: hass_purge_database
  description: 定期清理数据库，保持数据库大小合理
  triggers:
    - trigger: time
      at: "03:00:00"
  conditions: []
  actions:
    - action: recorder.purge
      data:
        keep_days: 30
        repack: true
  mode: single

- alias: HASS - 备份配置
  id: hass_backup_config
  description: 每周一按系统备份设置创建自动备份，保留策略由备份管理器执行
  triggers:
    - trigger: time
      at: "02:00:00"
  conditions:
    - condition: template
      value_template: "{{ now().weekday() == 0 }}"
  actions:
    # 先在“设置 → 系统 → 备份”配置备份位置、内容和保留策略。
    # 使用此自动化定时时，请关闭备份界面中的额外定时，避免重复备份。
    - action: backup.create_automatic
  mode: single


# 旧的 hass_cleanup_backups 自动化已移除。
# 自动备份的清理由备份管理器按界面配置的保留策略执行，无需 python_script。
